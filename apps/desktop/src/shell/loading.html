<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>OpenPulse</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070b1d;
        --panel: #0e1434;
        --line: #1e2654;
        --text: #e8eaff;
        --dim: #a6acd6;
        --accent: #7c3aed;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(40rem 30rem at 50% 30%, rgb(99 102 241 / 0.16), transparent 60%),
          var(--bg);
        color: var(--text);
        font:
          14px/1.6 'Inter',
          -apple-system,
          'Segoe UI',
          system-ui,
          sans-serif;
      }
      .card {
        width: min(30rem, 90vw);
        text-align: center;
      }
      .mark {
        display: block;
        width: 4.5rem;
        height: 4.5rem;
        margin: 0 auto 1.25rem;
        animation: pulse 2.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          filter: drop-shadow(0 0 0.4rem rgb(124 58 237 / 0.35));
        }
        50% {
          transform: scale(1.05);
          filter: drop-shadow(0 0 1.2rem rgb(34 211 238 / 0.55));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .mark {
          animation: none;
        }
      }
      h1 {
        font-size: 1.35rem;
        letter-spacing: -0.01em;
        margin: 0 0 0.35rem;
      }
      h1 span {
        background: linear-gradient(90deg, #60a5fa, #22d3ee);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        color: var(--dim);
        margin: 0.25rem 0;
      }
      .log {
        margin-top: 1.5rem;
        padding: 0.6rem 0.8rem;
        text-align: left;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 0.5rem;
        font-family: ui-monospace, 'Cascadia Mono', monospace;
        font-size: 11.5px;
        color: var(--dim);
        max-height: 9rem;
        overflow: auto;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg
        class="mark"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
        viewBox="0 0 128 128"
        fill="none"
      >
        <defs>
          <linearGradient
            id="halo-ring"
            x1="22"
            y1="20"
            x2="106"
            y2="108"
            gradientUnits="userSpaceOnUse"
          >
            <stop offset="0" stop-color="#38BDF8" />
            <stop offset="0.5" stop-color="#6366F1" />
            <stop offset="1" stop-color="#A855F7" />
          </linearGradient>
          <linearGradient
            id="halo-inner"
            x1="100"
            y1="28"
            x2="46"
            y2="88"
            gradientUnits="userSpaceOnUse"
          >
            <stop offset="0" stop-color="#ECFEFF" />
            <stop offset="0.35" stop-color="#67E8F9" />
            <stop offset="0.75" stop-color="#6366F1" stop-opacity="0.55" />
            <stop offset="1" stop-color="#7C3AED" stop-opacity="0.15" />
          </linearGradient>
          <filter id="halo-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="6" />
          </filter>
        </defs>
        <circle
          cx="64"
          cy="64"
          r="42"
          stroke="url(#halo-ring)"
          stroke-width="10"
          opacity="0.85"
          filter="url(#halo-glow)"
        />
        <circle
          cx="72"
          cy="57"
          r="31"
          stroke="#67E8F9"
          stroke-width="6"
          opacity="0.45"
          filter="url(#halo-glow)"
        />
        <circle cx="64" cy="64" r="42" stroke="url(#halo-ring)" stroke-width="7" />
        <circle cx="72" cy="57" r="31" stroke="url(#halo-inner)" stroke-width="4.5" />
      </svg>
      <h1>Open<span>Pulse</span></h1>
      <p id="detail">Starting the gateway…</p>
      <p id="state" style="font-size: 12px"></p>
      <pre class="log" id="log" hidden></pre>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const detail = params.get('detail');
      if (detail) document.getElementById('detail').textContent = detail;

      const logEl = document.getElementById('log');
      const stateEl = document.getElementById('state');
      const lines = [];

      if (window.openpulseDesktop) {
        window.openpulseDesktop.onGatewayStatus((status) => {
          stateEl.textContent =
            status.state === 'starting'
              ? 'starting'
              : status.state === 'probing'
                ? 'looking for a running gateway'
                : status.state === 'restarting'
                  ? 'restarting'
                  : status.state;
        });
        window.openpulseDesktop.onGatewayLog(({ line }) => {
          lines.push(line);
          if (lines.length > 40) lines.shift();
          logEl.hidden = false;
          logEl.textContent = lines.join('\n');
          logEl.scrollTop = logEl.scrollHeight;
        });
      }
    </script>
  </body>
</html>
